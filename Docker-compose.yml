version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-query-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: medical-query-postgres
    environment:
      POSTGRES_DB: medical_queries
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
